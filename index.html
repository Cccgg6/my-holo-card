function gemColor(t) {
  const r = Math.round(clamp(t[0], 0, 1.2) * 235),
        g = Math.round(clamp(t[1], 0, 1.2) * 235),
        b = Math.round(clamp(t[2], 0, 1.2) * 235);
  return `rgb(${r},${g},${b})`;
}

const cards = DECK.variants;
const canvas = document.createElement('canvas');
frontEl.appendChild(canvas);
const renderer = await factory(
  canvas,
  {
    character: DECK.shared.character,
    background: cards[0].background,
    ui: DECK.shared.ui,
    structure: DECK.shared.structure,
    logo: DECK.logo,
  },
  cards[0].tint,
);
backImg.src = DECK.back;

// ---- State ----
let active = 0, pending = null;
let flip = 0, flipTarget = 0;
let gx = 0, gy = 0, tgx = 0, tgy = 0;   // gyro (eased)
let dx = 0, dy = 0;                       // drag tilt (spring back)
const REST_X = -5, REST_Y = -8;           // resting tilt (avoids dead-on overexposure)
const PITCH_LIMIT = 25;                   // maximum vertical card tilt in either direction
let dragging = false;
let prevVisible = true;
let lastDrawX = 999, lastDrawY = 999;
let autoFlipArmed = true;

// Random idle-sway components (organic free float)
const sway = [];
for (let i = 0; i < 3; i++) {
  sway.push({
    fx: 0.18 + Math.random() * 0.45,
    fy: 0.16 + Math.random() * 0.42,
    px: Math.random() * Math.PI * 2,
    py: Math.random() * Math.PI * 2,
    ax: 1.4 + Math.random() * 1.8,
    ay: 1.6 + Math.random() * 2.0,
  });
}

function setActive(i) {
  const updateLabels = () => {
    active = i;
    nameEl.textContent = cards[active].name;
    const c = gemColor(cards[active].tint);
    gemEl.style.setProperty('--gem', c);
    gemEl.style.background = c;
    gemEl.style.boxShadow = `0 0 10px ${c},0 0 3px #fff inset`;
    lastDrawX = 999;
  };
  if (i === active) {
    updateLabels();
    return Promise.resolve();
  }
  return renderer.setVariant(cards[i].background, cards[i].tint).then(updateLabels);
}

function showAssetError(error) {
  console.error(error);
  statusEl.textContent = '卡片资源加载失败，请刷新页面后重试。';
  statusEl.hidden = false;
}

// ---- Tap behavior ----
function onTap() {
  ensureGyro();
  // Determine currently shown side
  const visible = Math.cos((flip) * Math.PI / 180) > 0;
  if (visible) {
    // First click: flip to back
    flipTarget += 180;
  } else {
    // Second click: random other card, then flip back to front
    let next = active;
    if (cards.length > 1) {
      while (next === active) next = (Math.random() * cards.length) | 0;
    }
    pending = next;
    renderer.preloadBackground(cards[next].background).catch(showAssetError);
    flipTarget += 180;
  }
}

// ---- Pointer: drag to tilt, tap to flip ----
let ptr = null, sx0 = 0, sy0 = 0, lx = 0, ly = 0, moved = false;
card.addEventListener('pointerdown', (e) => {
  if (ptr !== null) return;
  ptr = e.pointerId; dragging = true;
  sx0 = e.clientX; sy0 = e.clientY; lx = e.clientX; ly = e.clientY; moved = false;
  card.setPointerCapture(e.pointerId);
});
card.addEventListener('pointermove', (e) => {
  if (!dragging || ptr !== e.pointerId) return;
  const ddx = e.clientX - lx, ddy = e.clientY - ly;
  if (Math.hypot(e.clientX - sx0, e.clientY - sy0) > 9) moved = true;
  if (moved) {
    dy = clamp(dy + ddx * 0.75, -85, 85);
    dx = clamp(dx - ddy * 0.4, -PITCH_LIMIT, PITCH_LIMIT);
  }
  lx = e.clientX; ly = e.clientY;
});
function endPointer(e) {
  if (ptr !== e.pointerId) return;
  ptr = null; dragging = false;
  if (card.hasPointerCapture(e.pointerId)) card.releasePointerCapture(e.pointerId);
  if (!moved) onTap();
}
card.addEventListener('pointerup', endPointer);
card.addEventListener('pointercancel', () => { ptr = null; dragging = false; });
card.addEventListener('lostpointercapture', () => { if (dragging) { dragging = false; } });

// ---- Gyroscope (mobile) ----
let calib = null, gyroStarted = false;
function onOrientation(e) {
  if (!Number.isFinite(e.beta) || !Number.isFinite(e.gamma)) return;
  const ang = ((screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI) / 180;
  if (calib === null) calib = { beta: e.beta, gamma: e.gamma };
  let db = e.beta - calib.beta, dg = e.gamma - calib.gamma;
  // wrap not needed for small tilt
  const b = db, g = dg;
  tgx = clamp(-b * Math.cos(ang) + g * Math.sin(ang), -PITCH_LIMIT, PITCH_LIMIT);
  tgy = clamp(g * Math.cos(ang) - b * Math.sin(ang), -14, 14) * 0.7;
}
function ensureGyro() {
  if (gyroStarted) return;
  gyroStarted = true;
  const start = () => {
    addEventListener('deviceorientation', onOrientation);
    hintEl.textContent = '已启用陀螺仪 · 转动手机查看 · 点击翻面/切换';
  };
  const DOE = globalThis.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    DOE.requestPermission().then((s) => { if (s === 'granted') start(); }).catch(() => {});
  } else if (DOE) {
    start();
  }
}

// ---- Main loop ----
function frame(now) {
  const t = now / 1000;
  let ix = 0, iy = 0;
  for (const s of sway) {
    ix += s.ax * Math.sin(t * s.fx + s.px);
    iy += s.ay * Math.sin(t * s.fy + s.py);
  }
  flip += (flipTarget - flip) * 0.14;
  gx += (tgx - gx) * 0.12; gy += (tgy - gy) * 0.12;
  if (!dragging) { dx += (0 - dx) * 0.07; dy += (0 - dy) * 0.07; }

  const rotX = clamp(REST_X + ix + gx + dx, -PITCH_LIMIT, PITCH_LIMIT);
  const yaw = REST_Y + iy + gy + dy;
  const rotY = flip + yaw;
  card.style.transform = `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;

  const flipSettled = Math.abs(flipTarget - flip) < 0.5;
  if (flipSettled && Math.abs(yaw) <= 75) autoFlipArmed = true;
  if (flipSettled && autoFlipArmed && Math.abs(yaw) > 75) {
    flipTarget += Math.sign(yaw) * 180;
    autoFlipArmed = false;
  }

  const visible = Math.cos(rotY * Math.PI / 180) * Math.cos(rotX * Math.PI / 180) > 0.001;

  // When flipping back to front, swap variant at the edge crossing
  if (pending !== null && visible && !prevVisible) {
    setActive(pending).catch(showAssetError); pending = null;
  }
  prevVisible = visible;

  frontEl.style.visibility = visible ? 'visible' : 'hidden';
  backEl.style.visibility = visible ? 'hidden' : 'visible';

  if (visible) {
    // front-relative view (remove the 360-based flip) for parallax
    const flipBase = Math.round(flipTarget / 360) * 360;
    const viewX = rotX, viewY = rotY - flipBase;
    if (Math.abs(viewX - lastDrawX) > 0.04 || Math.abs(viewY - lastDrawY) > 0.04) {
      renderer.draw(viewX, viewY, 1, 0, 0.18);
      lastDrawX = viewX; lastDrawY = viewY;
    }
  }
  requestAnimationFrame(frame);
}

statusEl.hidden = true;
setActive(0).catch(showAssetError);
renderer.draw(REST_X, REST_Y, 1, 0, 0.18);
requestAnimationFrame(frame);

function preloadNextBackground(index) {
  if (index >= cards.length) return;
  const preload = () =>
    renderer.preloadBackground(cards[index].background)
      .then(() => preloadNextBackground(index + 1))
      .catch(showAssetError);
  if ('requestIdleCallback' in globalThis) {
    globalThis.requestIdleCallback(preload, { timeout: 2000 });
  } else {
    setTimeout(preload, 500);
  }
}
preloadNextBackground(1);
</script></body></html>
